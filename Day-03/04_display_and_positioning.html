<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 03 - Display &amp; Positioning</title>
    <link rel="stylesheet" href="04_style.css">
</head>
<body>

    <header class="sticky-nav">
        <h2>Sticky Navigation Header (position: sticky)</h2>
    </header>

    <main class="container">
        <section class="card relative-parent">
            <h3>Relative &amp; Absolute Positioning</h3>
            <p>Parent card has <code>position: relative</code>.</p>
            <span class="badge absolute-child">Badge (position: absolute)</span>
        </section>
    </main>

    <button class="fixed-btn">⬆ Top (position: fixed)</button>

</body>
</html>
