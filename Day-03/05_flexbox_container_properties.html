<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 03 - Flexbox Container Properties</title>
    <link rel="stylesheet" href="05_style.css">
</head>
<body>

    <header>
        <h1>Day 03: Flexbox Container Properties</h1>
        <p>Demonstrating <code>justify-content</code>, <code>align-items</code>, and <code>flex-direction</code>.</p>
    </header>

    <!-- DEMO 1: JUSTIFY-CONTENT SPACE-BETWEEN -->
    <section class="demo-section">
        <h2>1. justify-content: space-between (Row)</h2>
        <div class="flex-container flex-space-between">
            <div class="flex-item">Item 1</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
        </div>
    </section>

    <!-- DEMO 2: JUSTIFY-CONTENT CENTER & ALIGN-ITEMS CENTER -->
    <section class="demo-section">
        <h2>2. Centering Both Axes (justify-content: center &amp; align-items: center)</h2>
        <div class="flex-container flex-center-all">
            <div class="flex-item">Perfectly Centered Box</div>
        </div>
    </section>

</body>
</html>
