<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox: align-items</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    h2 {
      margin-top: 30px;
      color: #444;
    }

    /* align-items controls alignment along the CROSS axis.
       Since flex-direction is row here, the cross axis is vertical,
       so we give the container a fixed height to clearly see the effect. */
    .flex-container {
      display: flex;
      height: 150px;
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      gap: 10px;
      margin-bottom: 10px;
    }

    .stretch    { align-items: stretch; }
    .flex-start { align-items: flex-start; }
    .flex-end   { align-items: flex-end; }
    .center     { align-items: center; }
    .baseline   { align-items: baseline; }

    .box {
      background-color: #2ecc71;
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      text-align: center;
    }

    /* Different heights/font-sizes to make the alignment differences visible */
    .box.short { font-size: 14px; }
    .box.tall  { font-size: 28px; padding: 30px 20px; }
  </style>
</head>
<body>

  <h1>CSS Flexbox — align-items</h1>

  <h2>1. align-items: stretch (default — items fill container height)</h2>
  <div class="flex-container stretch">
    <div class="box short">Short</div>
    <div class="box tall">Tall</div>
    <div class="box short">Short</div>
  </div>

  <h2>2. align-items: flex-start</h2>
  <div class="flex-container flex-start">
    <div class="box short">Short</div>
    <div class="box tall">Tall</div>
    <div class="box short">Short</div>
  </div>

  <h2>3. align-items: flex-end</h2>
  <div class="flex-container flex-end">
    <div class="box short">Short</div>
    <div class="box tall">Tall</div>
    <div class="box short">Short</div>
  </div>

  <h2>4. align-items: center</h2>
  <div class="flex-container center">
    <div class="box short">Short</div>
    <div class="box tall">Tall</div>
    <div class="box short">Short</div>
  </div>

  <h2>5. align-items: baseline</h2>
  <div class="flex-container baseline">
    <div class="box short">Short</div>
    <div class="box tall">Tall</div>
    <div class="box short">Short</div>
  </div>

</body>
</html>
