<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox: justify-content</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    h2 {
      margin-top: 30px;
      color: #444;
    }

    /* Flex container used for every example below.
       justify-content controls spacing along the MAIN axis (horizontal, since
       flex-direction is row by default). */
    .flex-container {
      display: flex;
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .flex-start   { justify-content: flex-start; }
    .flex-end     { justify-content: flex-end; }
    .center       { justify-content: center; }
    .space-between{ justify-content: space-between; }
    .space-around { justify-content: space-around; }
    .space-evenly { justify-content: space-evenly; }

    .box {
      background-color: #e94e77;
      color: white;
      font-weight: bold;
      padding: 15px 20px;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox — justify-content</h1>

  <h2>1. justify-content: flex-start (default)</h2>
  <div class="flex-container flex-start">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

  <h2>2. justify-content: flex-end</h2>
  <div class="flex-container flex-end">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

  <h2>3. justify-content: center</h2>
  <div class="flex-container center">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

  <h2>4. justify-content: space-between</h2>
  <div class="flex-container space-between">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

  <h2>5. justify-content: space-around</h2>
  <div class="flex-container space-around">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

  <h2>6. justify-content: space-evenly</h2>
  <div class="flex-container space-evenly">
    <div class="box">A</div><div class="box">B</div><div class="box">C</div>
  </div>

</body>
</html>
