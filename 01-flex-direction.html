<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox: flex-direction</title>
  <style>
    /* Basic page styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    h2 {
      margin-top: 40px;
      color: #444;
    }

    /* The flex container - this is where flexbox begins */
    .flex-container {
      display: flex;              /* turns this element into a flex container */
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      gap: 10px;                  /* spacing between items, no margin needed */
    }

    /* Row direction (default) - items placed left to right */
    .row {
      flex-direction: row;
    }

    /* Row-reverse - items placed right to left */
    .row-reverse {
      flex-direction: row-reverse;
    }

    /* Column direction - items placed top to bottom */
    .column {
      flex-direction: column;
    }

    /* Column-reverse - items placed bottom to top */
    .column-reverse {
      flex-direction: column-reverse;
    }

    /* Styling for each flex item box */
    .box {
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      min-width: 60px;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox — flex-direction</h1>

  <h2>1. flex-direction: row (default)</h2>
  <div class="flex-container row">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>2. flex-direction: row-reverse</h2>
  <div class="flex-container row-reverse">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>3. flex-direction: column</h2>
  <div class="flex-container column">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>4. flex-direction: column-reverse</h2>
  <div class="flex-container column-reverse">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

</body>
</html>
